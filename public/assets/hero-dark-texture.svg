<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Matte Charcoal Textured Backdrop Gradient -->
    <linearGradient id="charcoal-canvas-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10" />
      <stop offset="35%" stop-color="#07080a" />
      <stop offset="70%" stop-color="#040507" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Micro Charcoal Noise / Matte Film Grain Filter -->
    <filter id="charcoal-matte-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="grain" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.12  0 1 0 0 0.14  0 0 1 0 0.18  0 0 0 0.038 0" />
    </filter>

    <!-- Gaussian Blur Filters for Soft Silky Volumetric Rays & Shadow Creases -->
    <filter id="silk-broad-diffusion" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="75" />
    </filter>
    <filter id="silk-ray-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="silk-crease-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="shadow-valley-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <!-- Vertical Silky Ray Gradients (Moody Silver & Soft Slate Sheen on Charcoal) -->
    <!-- Ray 1: Left Outer Vertical Cascade -->
    <linearGradient id="vertical-ray-1" x1="20%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.14" />
      <stop offset="30%" stop-color="#64748b" stop-opacity="0.11" />
      <stop offset="65%" stop-color="#334155" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Ray 2: Left Mid Vertical Fold -->
    <linearGradient id="vertical-ray-2" x1="15%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.18" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.13" />
      <stop offset="60%" stop-color="#475569" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Ray 3: Right Mid Vertical Fold -->
    <linearGradient id="vertical-ray-3" x1="75%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.20" />
      <stop offset="30%" stop-color="#94a3b8" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#475569" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Ray 4: Right Outer Vertical Cascade -->
    <linearGradient id="vertical-ray-4" x1="85%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#64748b" stop-opacity="0.09" />
      <stop offset="70%" stop-color="#334155" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Fine Silky Highlights along the vertical crests -->
    <linearGradient id="silk-crest-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.24" />
      <stop offset="25%" stop-color="#e2e8f0" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Vertical Silky Shadow Crease (Deep Moody Folds) -->
    <linearGradient id="silk-shadow-crease" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Center Subtle Ambient Illumination (Moody, Dark, Sleek) -->
    <radialGradient id="center-ambient-glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.02" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Center Faint Geometric Grid Pattern (Minimalist 44px Grid) -->
    <pattern id="minimalist-center-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.10" />
      <!-- Subtle intersection accent dot at coordinate corners -->
      <circle cx="0" cy="0" r="1.1" fill="#cbd5e1" fill-opacity="0.22" />
    </pattern>

    <!-- Smooth Radial Fade Mask for Center Grid -->
    <radialGradient id="grid-fade-mask" cx="50%" cy="46%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="center-grid-mask">
      <rect width="1920" height="1080" fill="url(#grid-fade-mask)" />
    </mask>

    <!-- Overall Sleek Vignette for Vignetted Edges -->
    <radialGradient id="sleek-vignette" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </radialGradient>
  </defs>

  <!-- 1. Dark Charcoal Backdrop Base -->
  <rect width="1920" height="1080" fill="url(#charcoal-canvas-base)" />

  <!-- 2. Subtle Matte Charcoal Surface Grain Texture -->
  <rect width="1920" height="1080" filter="url(#charcoal-matte-grain)" />

  <!-- 3. Soft Subtle Vertical Silky Light Rays and Shadows (Falling Vertically with Organic Curves) -->

  <!-- 3a. Deep Falling Shadow Valleys (Underneath the light crests to give real fabric/column drape) -->
  <g filter="url(#shadow-valley-blur)">
    <!-- Left shadow valley 1 -->
    <path d="M 60,-40 C 90,300 130,700 180,1120 L 320,1120 C 260,700 220,300 170,-40 Z" fill="url(#silk-shadow-crease)" />
    <!-- Left shadow valley 2 -->
    <path d="M 390,-40 C 420,320 460,700 520,1120 L 630,1120 C 580,700 530,320 480,-40 Z" fill="url(#silk-shadow-crease)" opacity="0.85" />
    <!-- Right shadow valley 1 -->
    <path d="M 1290,-40 C 1260,320 1210,700 1150,1120 L 1260,1120 C 1310,700 1360,320 1400,-40 Z" fill="url(#silk-shadow-crease)" opacity="0.9" />
    <!-- Right shadow valley 2 -->
    <path d="M 1600,-40 C 1560,300 1510,700 1450,1120 L 1570,1120 C 1630,700 1670,300 1710,-40 Z" fill="url(#silk-shadow-crease)" />
  </g>

  <!-- 3b. Broad Ambient Light Dispersion (Soft, silky diffusion) -->
  <g filter="url(#silk-broad-diffusion)">
    <!-- Left vertical curtain wash -->
    <path d="M -80,-60 C 50,300 150,720 280,1140 L 520,1140 C 380,720 280,300 140,-60 Z" fill="url(#vertical-ray-1)" />
    <path d="M 190,-60 C 310,320 420,720 560,1140 L 780,1140 C 640,720 520,320 380,-60 Z" fill="url(#vertical-ray-2)" opacity="0.85" />

    <!-- Right vertical curtain wash -->
    <path d="M 1740,-60 C 1620,300 1510,720 1380,1140 L 1150,1140 C 1280,720 1380,300 1520,-60 Z" fill="url(#vertical-ray-3)" />
    <path d="M 1980,-60 C 1850,320 1730,720 1590,1140 L 1380,1140 C 1510,720 1630,320 1760,-60 Z" fill="url(#vertical-ray-4)" opacity="0.8" />
  </g>

  <!-- 3c. Defined Vertical Silky Light Rays (Falling gracefully top-to-bottom) -->
  <g filter="url(#silk-ray-blur)">
    <!-- Ray Left Outer -->
    <path d="M 40,-40 C 120,320 220,700 320,1120 L 410,1120 C 310,700 210,320 130,-40 Z" fill="url(#vertical-ray-1)" />
    <!-- Ray Left Inner -->
    <path d="M 260,-40 C 360,340 480,700 590,1120 L 680,1120 C 570,700 450,340 340,-40 Z" fill="url(#vertical-ray-2)" />
    <!-- Ray Right Inner -->
    <path d="M 1660,-40 C 1560,340 1440,700 1330,1120 L 1240,1120 C 1350,700 1470,340 1570,-40 Z" fill="url(#vertical-ray-3)" />
    <!-- Ray Right Outer -->
    <path d="M 1880,-40 C 1780,320 1660,700 1550,1120 L 1460,1120 C 1570,700 1690,320 1790,-40 Z" fill="url(#vertical-ray-4)" />
  </g>

  <!-- 3d. Delicate Silky Fold Creases & Shimmer Accents -->
  <g filter="url(#silk-crease-blur)">
    <!-- Fold 1 (Left) -->
    <path d="M 85,-20 C 165,330 260,690 365,1100" stroke="url(#silk-crest-highlight)" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.75" />
    <!-- Fold 2 (Left) -->
    <path d="M 295,-20 C 395,350 510,690 625,1100" stroke="url(#silk-crest-highlight)" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.85" />
    <!-- Fold 3 (Right) -->
    <path d="M 1625,-20 C 1525,350 1410,690 1295,1100" stroke="url(#silk-crest-highlight)" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.9" />
    <!-- Fold 4 (Right) -->
    <path d="M 1835,-20 C 1735,330 1630,690 1525,1100" stroke="url(#silk-crest-highlight)" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- 4. Subtle Center Ambient Glow for Sleek UI Balance -->
  <rect width="1920" height="1080" fill="url(#center-ambient-glow)" />

  <!-- 5. Faint Subtle Geometric Grid Lines in the Center -->
  <rect width="1920" height="1080" fill="url(#minimalist-center-grid)" mask="url(#center-grid-mask)" />

  <!-- 6. Perimeter Sleek Vignette (Ensuring rich dark borders and depth) -->
  <rect width="1920" height="1080" fill="url(#sleek-vignette)" pointer-events="none" />
</svg>
